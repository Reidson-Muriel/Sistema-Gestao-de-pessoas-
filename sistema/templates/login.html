<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
 
    <title>Login</title>
</head>

<body>
    <h2>Login</h2>
    <div class="form-floating mb-3">
        <input type="email" class="form-control" id="floatingInput" placeholder="Username">
        <label for="floatingInput" style="max-width: 90%; text-overflow: ellipsis; white-space: nowrap;">UserName</label>
    </div>
    <div class="form-floating">
        <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
        <label for="floatingPassword" style="max-width: 90%; text-overflow: ellipsis; white-space: nowrap;">Password</label>
    </div>
    <form id="form-login">
        <input type="text" id="username" placeholder="Nome Usuário" <br><br>
        <input type="password" id="password" placeholder="Senha do usuário" <br><br>
        <button type="submit">Entrar</button>
    </form>

    <p id="msg"></p>
</body>
<script src="static/js/login.js"></script>

</html>
